[package]
name = "mkw-emutest"
description = "Boots Mario Kart World in an Eden-based emulator with mods written by mkwtrack, and records screenshots and logs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
mkwtrack = { path = "../../core" }
glam = "0.34.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde_json = "1.0.154"
x11rb = { version = "0.13.2", features = ["xtest"] }
