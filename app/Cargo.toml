[package]
name = "trackstudioworld"
description = "TrackStudioWorld: a course editor for Mario Kart World (Rust, Kirigami, Qt Quick 3D)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme = "../README.md"
publish = false

[dependencies]
mkwtrack = { path = "../core" }
cxx = "1"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
glam = "0.34.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde_json = "1.0.154"

[build-dependencies]
cxx-qt-build = "0.10.0"
