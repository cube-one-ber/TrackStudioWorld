[workspace]
resolver = "3"
members = ["core", "app", "tools/emutest"]
default-members = ["core", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "0BSD"
rust-version = "1.90"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Its BC6H decoder shifts by the endpoint width of reserved block modes, which overflows; release
# builds wrap. Keep debug builds decoding the same way instead of panicking.
[profile.dev.package.texture2ddecoder]
overflow-checks = false

[profile.release]
opt-level = 3
