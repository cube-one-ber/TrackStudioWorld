name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The library and the test harness: no Qt needed. Tests that need game files skip.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p mkwtrack -p mkw-emutest --all-targets -- -D warnings
      - run: cargo test -p mkwtrack -p mkw-emutest

  # The app, against current Qt 6 and KDE Frameworks 6.
  app:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git rust qt6-base qt6-declarative qt6-quick3d kirigami qqc2-desktop-style breeze
      - uses: actions/checkout@v7
      # The cached build holds code generated from the Qt headers, so a Qt update starts a new cache.
      - id: qt
        run: echo "key=$(pacman -Q qt6-base qt6-declarative qt6-quick3d kirigami | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: qt-${{ steps.qt.outputs.key }}
      - run: cargo clippy -p trackstudioworld --all-targets -- -D warnings
      - run: cargo test -p trackstudioworld
